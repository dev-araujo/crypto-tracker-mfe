<div class="segmented" role="radiogroup" [attr.aria-label]="groupLabel()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="segmented__option"
      role="radio"
      [class.segmented__option--active]="option.value === value()"
      [attr.aria-checked]="option.value === value()"
      [attr.title]="option.description ?? null"
      (click)="select(option)"
    >
      {{ option.label }}
    </button>
  }
</div>
