<img class="identity__icon" [src]="iconUrl()" [alt]="" loading="lazy" decoding="async" />

<span class="identity__text">
  <span class="identity__name">{{ name() }}</span>
  <span class="identity__meta">
    <span class="identity__symbol">{{ symbol() }}</span>
    @if (rank(); as rank) {
      <span class="identity__rank numeric">#{{ rank }}</span>
    }
  </span>
</span>
